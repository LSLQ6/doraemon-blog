name: 同步快递物流

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 查询并更新物流轨迹
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KDNIAO_EBUSINESSID: ${{ secrets.KDNIAO_EBUSINESSID }}
          KDNIAO_APPKEY: ${{ secrets.KDNIAO_APPKEY }}
        run: node scripts/tracking-sync.mjs
